# be261028 Prometheus scrape configuration example
#
# The local docker Prometheus configuration lives at:
#   ~/github/hangtiancheng/docker/prometheus/prometheus.yml (mounted read-only)
# Append the jobs below to its scrape_configs to scrape the three Go services.
#
# Note: the gateway exposes /metrics on its main HTTP port 8091; activity/trade
# expose theirs on dedicated metrics ports (19101/19102, see configs/activity.yaml
# and configs/trade.yaml). When Prometheus runs inside the docker network, use
# host.docker.internal to reach host ports.

scrape_configs:
  - job_name: be261028-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8091"]

  - job_name: be261028-activity
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:19101"]

  - job_name: be261028-trade
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:19102"]
