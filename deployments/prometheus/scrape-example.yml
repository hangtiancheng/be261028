# be261028 Prometheus 抓取配置示例
#
# 本机 docker 的 Prometheus 配置文件位于：
#   ~/github/hangtiancheng/docker/prometheus/prometheus.yml （只读挂载）
# 将下面的 job 追加到其 scrape_configs 后即可抓取三个 Go 服务的指标。
#
# 注意：gateway 的 /metrics 暴露在主 HTTP 端口 8091；activity/trade 暴露在各自的
# metrics 端口（19101/19102，见 configs/activity.yaml 与 configs/trade.yaml）。
# 若 Prometheus 运行在 docker 网络内，请用 host.docker.internal 访问宿主机端口。

scrape_configs:
  - job_name: be261028-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8091"]

  - job_name: be261028-activity
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:19101"]

  - job_name: be261028-trade
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:19102"]
