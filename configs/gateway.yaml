# be261028 gateway service configuration
service:
  name: gateway
  httpAddr: "127.0.0.1:8091"   # public HTTP port (same as the legacy project); /metrics and /health share it
  webDir: "frontend/dist"       # build output of the new frontend (Vite+Lit+lit-jsx+Tailwind), relative to the working directory

rpc:
  activityTarget: "127.0.0.1:19001"
  tradeTarget: "127.0.0.1:19002"
  timeout: 5s

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  poolSize: 10

dcc:
  topic: "be261028_dynamic_config_center"
  defaults:
    downgradeSwitch: "0"
    cutRange: "100"
    scBlacklist: "s02c02"
    cacheSwitch: "0"

log:
  level: "info"
