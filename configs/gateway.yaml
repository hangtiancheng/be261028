# be261028 gateway 服务配置
service:
  name: gateway
  httpAddr: "127.0.0.1:8091"   # 对外 HTTP 端口（与旧项目一致），/metrics 与 /health 同端口
  webDir: "frontend/dist"       # 新前端（Vite+Lit+lit-jsx+Tailwind）构建产物（相对工作目录）

rpc:
  activityTarget: "127.0.0.1:19001"
  tradeTarget: "127.0.0.1:19002"
  timeout: 5s

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  poolSize: 10

dcc:
  topic: "be261028_dynamic_config_center"
  defaults:
    downgradeSwitch: "0"
    cutRange: "100"
    scBlacklist: "s02c02"
    cacheSwitch: "0"

log:
  level: "info"
